<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabels</title>
</head>
<body>
    <table border="1" style="border-collapse: collapse;">
        <tr>
            <th>username</th>
            <th>firstname</th>
            <th>lastname</th>
        </tr>
        <tr>
            <td>abc@gmail.com</td>
            <td>abc</td>
            <td>def</td>
        </tr>
        <tr>
            <td>abc2@gmail.com</td>
            <td rowspan="2">abc2</td>
            <td>def2</td>
        </tr>
        <tr>
            <td>abc3@gmail.com</td>
            <!-- <td>abc3</td> -->
            <td>def3</td>
        </tr>

    </table>
<br>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORM PAGE</title>
  </head>
  <body>
    <!--FORM TAG-->

    <form action="/action.php">
      <h3>Registration Form</h3>

      <input type="text" placeholder="UserName" />
      <br /><br />
      <input type="password" placeholder="PassWord" />
      <br />

      <hr />
      <h4>Select your Class</h4>
      <label for="101">
        <input type="radio" value="Class 11" name="Class" id="101" /> Class 11
      </label>
      <label for="102">
        <input type="radio" value="Class 12" name="Class" id="102" /> Class 12
      </label>
      <br />
      <hr />

      <h5>Select your Subject</h5>
      <label for="account">
        <input type="checkbox" value="Account" name="sub" id="101" />Account
      </label>
      <label for="eco">
        <input type="checkbox" value="Eco" name="sub" id="102" />Eco
      </label>
      <label for="Stat">
        <input type="checkbox" value="Stat" name="sub" id="103" />Stat
      </label>
      <label for="Eng">
        <input type="checkbox" value="Eng" name="sub" id="104" />Eng
      </label>

      <hr />
      <h5>Select Your City</h5>
      <select name="city">
        <option value="surat">Surat</option>
        <option value="Pune">Pune</option>
        <option value="Himatnager">Himatnager</option>
        <option value="Modasa">Modasa</option>
      </select>
      <br /><br />

      <textarea
        name="feedback"
        id="101"
        placeholder="Please give your feedback"
        rows="5"
        col="50"
      ></textarea>

      <br />

      <input type="submit" value="submit" />
      <input type="reset" value="reset" />
    </form>

    <hr />
    <!--Ifram Tag (aa tag ma koi pan link videos ni muki sakay)-->
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/HcOc7P5BMi4?si=Pf6vsL1K3ObwwoM5"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>

    <hr />
    <!--video Tag (aa tag ma tame koi pan video jem ke screen recording muki sakay)-->
    <video src=""></video>
  </body>
</html>
